<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Image Gallery</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
            color: #fbbf24;
        }

        .gallery {
            width: 600px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px #111;
        }

        #mainImage {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
        }

        #caption {
            color: #1e293b;
            font-size: 20px;
            font-weight: bold;
            margin: 15px;
        }

        button {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 10px 25px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #d97706;
        }

        #count {
            color: #64748b;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>📸 My Image Gallery</h1>

    <div class="gallery">

        <img id="mainImage"
        src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80">

        <div id="caption">Beautiful Nature</div>

        <div id="count">1 / 4</div>

        <button onclick="previousImage()">⬅ Previous</button>
        <button onclick="nextImage()">Next ➡</button>

    </div>

    <script>

        var images = [
            "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
        ];

        var captions = [
            "Beautiful Nature",
            "Peaceful Mountains",
            "Amazing Landscape",
            "Green Forest"
        ];

        var current = 0;

        function showImage() {

            document.getElementById("mainImage").src = images[current];

            document.getElementById("caption").innerHTML =
                captions[current];

            document.getElementById("count").innerHTML =
                (current + 1) + " / " + images.length;
        }

        function nextImage() {

            current++;

            if (current == images.length) {
                current = 0;
            }

            showImage();
        }

        function previousImage() {

            current--;

            if (current < 0) {
                current = images.length - 1;
            }

            showImage();
        }

    </script>

</body>
</html>
